name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build release artifacts
        run: swift build -c release
